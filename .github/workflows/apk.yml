
name: Gerar APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extrair projeto
        run: |
          ZIP="multiverse-packs-expandido-revisado.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP nao encontrado: $ZIP"
            ls -la
            exit 1
          fi

          mkdir projeto
          unzip -o "$ZIP" -d projeto

      - name: Localizar index.html
        run: |
          INDEX=$(find projeto -type f -name "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "index.html nao encontrado"
            find projeto -maxdepth 5 -type f
            exit 1
          fi

          ROOT=$(dirname "$INDEX")
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Projeto localizado em: $ROOT"

      - name: Preparar arquivos
        run: |
          cd "$PROJECT_ROOT"

          mkdir -p www
          cp index.html www/

          for item in styles src assets; do
            if [ -e "$item" ]; then
              cp -r "$item" www/
            fi
          done

      - name: Instalar dependencias
        run: |
          cd "$PROJECT_ROOT"
          npm install

      - name: Configurar Android
        run: |
          cd "$PROJECT_ROOT"
          npx cap add android

      - name: Compilar APK
        run: |
          cd "$PROJECT_ROOT/android"
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: multiverse-packs-apk
          path: ${{ env.PROJECT_ROOT }}/android/app/build/outputs/apk/debug/app-debug.apk
          
