
name: Gerar APK - Multiverse Packs

on:
  workflow_dispatch:
  push:
    paths:
      - "multiverse-packs-completo(5).zip"
      - ".github/workflows/apk.yml"

permissions:
  contents: read

concurrency:
  group: multiverse-packs-apk
  cancel-in-progress: true

env:
  ZIP_NAME: "multiverse-packs-completo(5).zip"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verificar ZIP
        run: |
          set -euo pipefail
          echo "Procurando: $ZIP_NAME"
          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::ZIP nao encontrado na raiz do repositorio."
            ls -la
            exit 1
          fi
          unzip -t "$ZIP_NAME"

      - name: Extrair projeto
        run: |
          set -euo pipefail
          mkdir -p projeto
          unzip -q "$ZIP_NAME" -d projeto

          if [ ! -f projeto/package.json ]; then
            FOUND=$(find projeto -mindepth 2 -maxdepth 3 -name package.json -print -quit)
            if [ -z "$FOUND" ]; then
              echo "::error::package.json nao encontrado dentro do ZIP."
              find projeto -maxdepth 3 -type f
              exit 1
            fi
            ROOT="${FOUND%/package.json}"
            cp -a "$ROOT"/. projeto/
          fi

          for file in index.html package.json capacitor.config.json src/main.js styles/base.css; do
            if [ ! -s "projeto/$file" ]; then
              echo "::error::Arquivo ausente: projeto/$file"
              find projeto -maxdepth 3 -type f
              exit 1
            fi
          done

      - name: Instalar dependencias
        working-directory: projeto
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Preparar arquivos web
        working-directory: projeto
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp -r src www/
          cp -r styles www/
          if [ -d assets ]; then cp -r assets www/; fi
          test -s www/index.html
          test -s www/src/main.js
          test -s www/styles/base.css

      - name: Validar Capacitor
        working-directory: projeto
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const config = JSON.parse(
            fs.readFileSync('capacitor.config.json', 'utf8')
          );

          if (config.webDir !== 'www') {
            console.error('webDir precisa ser www.');
            process.exit(1);
          }

          if (!config.appId || !config.appName) {
            console.error('appId ou appName ausente.');
            process.exit(1);
          }

          console.log('Configuracao validada.');
          NODE

      - name: Adicionar Android
        working-directory: projeto
        run: npx cap add android

      - name: Sincronizar Android
        working-directory: projeto
        run: npx cap sync android

      - name: Compilar APK
        working-directory: projeto/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Verificar APK
        run: |
          set -euo pipefail
          APK="projeto/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Multiverse-Packs-APK
          path: projeto/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
