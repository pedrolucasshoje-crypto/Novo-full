name: Gerar APK Android

on:
  push:
    paths:
      - "multiverse-packs-completo.zip"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Multiverse Packs
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Verificar ZIP enviado
        shell: bash
        run: |
          ZIP="multiverse-packs-completo.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Não encontrei $ZIP na raiz do repositório."
            echo "Arquivos encontrados:"
            ls -la
            exit 1
          fi
          unzip -t "$ZIP"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Extrair projeto
        shell: bash
        run: |
          mkdir -p projeto
          unzip -q multiverse-packs-completo.zip -d projeto
          test -f projeto/index.html
          test -f projeto/package.json
          test -f projeto/capacitor.config.json
          echo "Estrutura do projeto:"
          find projeto -maxdepth 2 -type f | sort | head -80

      - name: Instalar dependências
        working-directory: projeto
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Preparar plataforma Android
        working-directory: projeto
        run: npx cap add android

      - name: Sincronizar Capacitor
        working-directory: projeto
        run: npx cap sync android

      - name: Compilar APK de teste
        working-directory: projeto/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: multiverse-packs-apk-debug
          path: projeto/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
